<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title desc">
  <title id="title">Engineering problems I like working on</title>
  <desc id="desc">Distributed systems, concurrency and multithreading, tail latency and performance engineering, caching and JVM runtime behaviour, failure recovery and production observability, and applied machine learning.</desc>

  <defs>
    <linearGradient id="lineGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .card { fill:#f8fafc; stroke:#cbd5e1; stroke-width:1.2; }
    .label { fill:#0f172a; font:600 15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; text-anchor:middle; }
    .sub { fill:#475569; font:500 12px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; text-anchor:middle; }
    .wire { fill:none; stroke:url(#lineGradient); stroke-width:1.5; stroke-dasharray:7 9; opacity:.78; animation:flow 6s linear infinite; }
    .dot { fill:#334155; opacity:.8; animation:pulse 3.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    .d2 { animation-delay:.6s; }
    .d3 { animation-delay:1.2s; }
    .d4 { animation-delay:1.8s; }
    .d5 { animation-delay:2.4s; }
    .d6 { animation-delay:3s; }
    @keyframes flow { to { stroke-dashoffset:-64; } }
    @keyframes pulse { 0%,100% { opacity:.5; transform:scale(.9); } 50% { opacity:1; transform:scale(1.22); } }
    @media (prefers-reduced-motion: reduce) { .wire,.dot { animation:none; } }
  </style>

  <path class="wire" d="M145 83 H755 M145 167 H755 M145 83 C230 83 225 167 300 167 M300 83 C385 83 380 167 450 167 M450 83 C535 83 530 167 600 167 M600 83 C685 83 680 167 755 167"/>

  <g transform="translate(30 48)">
    <rect class="card" width="230" height="70" rx="14"/>
    <circle class="dot" cx="20" cy="20" r="4" filter="url(#softGlow)"/>
    <text class="label" x="115" y="30">Distributed systems</text>
    <text class="sub" x="115" y="50">scale · coordination · resilience</text>
  </g>

  <g transform="translate(335 48)">
    <rect class="card" width="230" height="70" rx="14"/>
    <circle class="dot d2" cx="20" cy="20" r="4" filter="url(#softGlow)"/>
    <text class="label" x="115" y="30">Concurrency</text>
    <text class="sub" x="115" y="50">multithreading · contention</text>
  </g>

  <g transform="translate(640 48)">
    <rect class="card" width="230" height="70" rx="14"/>
    <circle class="dot d3" cx="20" cy="20" r="4" filter="url(#softGlow)"/>
    <text class="label" x="115" y="30">Tail latency</text>
    <text class="sub" x="115" y="50">p99 · performance engineering</text>
  </g>

  <g transform="translate(30 132)">
    <rect class="card" width="230" height="70" rx="14"/>
    <circle class="dot d4" cx="20" cy="20" r="4" filter="url(#softGlow)"/>
    <text class="label" x="115" y="30">Caching &amp; JVM</text>
    <text class="sub" x="115" y="50">memory · GC · runtime behaviour</text>
  </g>

  <g transform="translate(335 132)">
    <rect class="card" width="230" height="70" rx="14"/>
    <circle class="dot d5" cx="20" cy="20" r="4" filter="url(#softGlow)"/>
    <text class="label" x="115" y="30">Failure recovery</text>
    <text class="sub" x="115" y="50">observability · correctness</text>
  </g>

  <g transform="translate(640 132)">
    <rect class="card" width="230" height="70" rx="14"/>
    <circle class="dot d6" cx="20" cy="20" r="4" filter="url(#softGlow)"/>
    <text class="label" x="115" y="30">Applied ML</text>
    <text class="sub" x="115" y="50">measurable · systems-oriented</text>
  </g>
</svg>