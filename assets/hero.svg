<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Asu Singh</title>
  <desc id="desc">Senior Software Engineer focused on distributed systems and performance engineering.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="48%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f3d3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="orbA">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>

  <circle cx="180" cy="90" r="190" fill="url(#orbA)">
    <animate attributeName="cx" values="150;340;150" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1010" cy="245" r="230" fill="url(#orbB)">
    <animate attributeName="cx" values="1030;860;1030" dur="14s" repeatCount="indefinite"/>
  </circle>

  <path d="M80 238 C260 190 360 270 535 218 S850 175 1120 224" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 18">
    <animate attributeName="stroke-dashoffset" values="0;-96" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M135 88 C330 55 460 120 635 82 S920 64 1070 110" fill="none" stroke="#cbd5e1" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="8 18">
    <animate attributeName="stroke-dashoffset" values="0;80" dur="10s" repeatCount="indefinite"/>
  </path>

  <g filter="url(#textShadow)" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="600" y="142" fill="#ffffff" font-size="76" font-weight="700" letter-spacing="0.5">Asu Singh</text>
    <text x="600" y="188" fill="#e2e8f0" font-size="22" font-weight="500" letter-spacing="0.4">Senior Software Engineer · Distributed Systems · Performance Engineering</text>
  </g>

  <g fill="#cbd5e1" opacity="0.7">
    <circle cx="140" cy="257" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="365" cy="231" r="3"><animate attributeName="opacity" values="1;0.35;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="213" r="3"><animate attributeName="opacity" values="0.45;1;0.45" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="195" r="3"><animate attributeName="opacity" values="1;0.4;1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="218" r="3"><animate attributeName="opacity" values="0.35;1;0.35" dur="4.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>